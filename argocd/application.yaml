apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp
  namespace: argocd
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/part-of: myapp-project
    environment: production
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: myapp-deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: myapp-alerts
    notifications.argoproj.io/subscribe.on-health-degraded.slack: myapp-alerts
  finalizers:
    # Ensures the application is fully deleted before the ArgoCD resource is removed
    - resources-finalizer.argocd.argoproj.io
spec:
  # Project this application belongs to
  project: myapp-project

  # Source repository configuration
  source:
    repoURL: https://github.com/mahesh200424/azure-private-deployment-aug26.git
    targetRevision: main
    path: helm/myapp

    # Helm-specific configuration
    helm:
      # Release name override (defaults to app name if omitted)
      releaseName: myapp

      # All production settings live in the chart, so the deployment pipeline
      # can update this tracked file without being overridden by inline values.
      valueFiles:
        - values.yaml

  # Destination cluster and namespace
  destination:
    # Use in-cluster deployment (ArgoCD is running in the same cluster)
    server: https://kubernetes.default.svc
    namespace: myapp

  # Sync policy — automated GitOps with safety guards
  syncPolicy:
    automated:
      # Remove resources from cluster that are no longer in Git
      prune: true
      # Revert manual changes made directly to the cluster
      selfHeal: true
      # Allow deleting running pods during sync
      allowEmpty: false

    syncOptions:
      # Automatically create the destination namespace if it doesn't exist
      - CreateNamespace=true
      # Use server-side apply (handles large resources, CRDs, merge conflicts better)
      - ServerSideApply=true
      # Fail the sync if any resource fails to sync
      - FailOnSharedResource=true
      # Respect ignore differences during sync
      - RespectIgnoreDifferences=true
      # Prune resources only after all others have synced successfully
      - PrunePropagationPolicy=foreground
      # Apply resources in waves defined by sync-wave annotations
      - ApplyOutOfSyncOnly=true

    # Retry policy for transient failures
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Fields to ignore when comparing live state with desired state
  # Prevents unnecessary sync triggers for fields managed by other controllers
  ignoreDifferences:
    # Argo Rollouts adds this selector to the active and preview Services.
    # RespectIgnoreDifferences prevents ArgoCD self-heal from undoing a promotion.
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
    # Ignore replicas managed by HPA
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # Ignore replicas managed by HPA on Rollout
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
    # Ignore fields injected by admission webhooks (e.g., Istio sidecar)
    - group: apps
      kind: Deployment
      managedFieldsManagers:
        - kube-controller-manager
    # Ignore token fields in ServiceAccounts (managed by k8s)
    - group: ""
      kind: ServiceAccount
      jsonPointers:
        - /secrets
    # Ignore caBundle injected by cert-manager or webhook controllers
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    # Ignore last-applied-configuration annotation (set by kubectl apply)
    - group: "*"
      kind: "*"
      managedFieldsManagers:
        - kubectl-client-side-apply

  # Health check override for Argo Rollouts
  # ArgoCD natively understands Rollout health if the Argo Rollouts plugin is installed
  revisionHistoryLimit: 10
