apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: myapp-analysis
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: analysis
spec:
  # ---------------------------------------------------------------
  # Arguments — injected by the Rollout at runtime
  # ---------------------------------------------------------------
  args:
    # The service name to scope metrics to (myapp-active or myapp-preview)
    - name: service-name
    # Success rate threshold (0.0–1.0), e.g. "0.99" means 99%
    - name: success-rate-threshold
      value: "0.99"
    # Error rate threshold (0.0–1.0), e.g. "0.01" means 1%
    - name: error-rate-threshold
      value: "0.01"
    # p99 latency threshold in milliseconds
    - name: latency-p99-threshold
      value: "500"

  # ---------------------------------------------------------------
  # Metrics — evaluated in parallel during the analysis run
  # ---------------------------------------------------------------
  metrics:

    # -----------------------------------------------------------
    # Metric 1: HTTP Success Rate
    # Measures the ratio of 2xx responses over total HTTP responses.
    # Uses the Prometheus counter exposed by your application or
    # the ingress-nginx controller.
    # -----------------------------------------------------------
    - name: success-rate
      # How long the analysis runs in total
      count: 10
      # Interval between measurements (1 per minute for 10 minutes)
      interval: 1m
      # How long to wait before starting (let traffic ramp up)
      initialDelay: 2m

      # Pass if >= threshold (e.g., 99% success rate)
      successCondition: "result[0] >= {{args.success-rate-threshold}}"
      # Fail immediately if < threshold minus 2% margin (hard failure)
      failureCondition: "result[0] < {{args.success-rate-threshold}} - 0.02"
      # Treat missing metrics as inconclusive (not failure) during ramp-up
      inconclusiveLimit: 3
      failureLimit: 2

      provider:
        prometheus:
          # TODO: Replace with your Prometheus endpoint
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090
          # Query: HTTP 2xx responses / total responses for the service
          # Uses ingress-nginx metrics — adjust for your ingress controller
          query: |
            sum(
              rate(
                nginx_ingress_controller_requests{
                  service="{{args.service-name}}",
                  namespace="myapp",
                  status=~"2[0-9]{2}"
                }[5m]
              )
            )
            /
            sum(
              rate(
                nginx_ingress_controller_requests{
                  service="{{args.service-name}}",
                  namespace="myapp"
                }[5m]
              )
            )

    # -----------------------------------------------------------
    # Metric 2: HTTP Error Rate
    # Measures the ratio of 5xx responses over total HTTP responses.
    # A high error rate means the new version is broken.
    # -----------------------------------------------------------
    - name: error-rate
      count: 10
      interval: 1m
      initialDelay: 2m

      # Pass if error rate is below threshold
      successCondition: "result[0] <= {{args.error-rate-threshold}}"
      # Fail immediately if error rate exceeds threshold + 0.5% margin
      failureCondition: "result[0] > {{args.error-rate-threshold}} + 0.005"
      inconclusiveLimit: 3
      failureLimit: 2

      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090
          # Query: 5xx error ratio
          query: |
            sum(
              rate(
                nginx_ingress_controller_requests{
                  service="{{args.service-name}}",
                  namespace="myapp",
                  status=~"5[0-9]{2}"
                }[5m]
              )
            )
            /
            sum(
              rate(
                nginx_ingress_controller_requests{
                  service="{{args.service-name}}",
                  namespace="myapp"
                }[5m]
              )
            )

    # -----------------------------------------------------------
    # Metric 3: p99 Latency
    # Measures the 99th percentile request latency in milliseconds.
    # Catches performance regressions not visible in error rates.
    # -----------------------------------------------------------
    - name: latency-p99
      count: 10
      interval: 1m
      initialDelay: 2m

      # Pass if p99 latency is under threshold (e.g., 500ms)
      # Prometheus histograms return seconds; multiply by 1000 for ms
      successCondition: "result[0] * 1000 <= {{args.latency-p99-threshold}}"
      # Fail if latency is 50% above threshold
      failureCondition: "result[0] * 1000 > {{args.latency-p99-threshold}} * 1.5"
      inconclusiveLimit: 3
      failureLimit: 2

      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090
          # Query: p99 response time using histogram_quantile
          # Adjust the metric name to match your app's histogram
          query: |
            histogram_quantile(
              0.99,
              sum by (le) (
                rate(
                  nginx_ingress_controller_response_duration_seconds_bucket{
                    service="{{args.service-name}}",
                    namespace="myapp"
                  }[5m]
                )
              )
            )

    # -----------------------------------------------------------
    # Metric 4: Application-level success rate
    # Uses metrics emitted directly by the app (not the ingress).
    # This catches errors that the ingress doesn't see (e.g., gRPC,
    # internal service calls).
    # -----------------------------------------------------------
    - name: app-success-rate
      count: 10
      interval: 1m
      initialDelay: 2m

      successCondition: "result[0] >= {{args.success-rate-threshold}}"
      failureCondition: "result[0] < {{args.success-rate-threshold}} - 0.02"
      inconclusiveLimit: 3
      failureLimit: 2

      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090
          # Query: App-level HTTP requests using Prometheus client library metrics
          # Adjust the metric name (http_requests_total) to match your app's metric
          query: |
            sum(
              rate(
                http_requests_total{
                  service="{{args.service-name}}",
                  namespace="myapp",
                  code=~"2[0-9]{2}"
                }[5m]
              )
            )
            /
            sum(
              rate(
                http_requests_total{
                  service="{{args.service-name}}",
                  namespace="myapp"
                }[5m]
              )
            )

    # -----------------------------------------------------------
    # Metric 5: Pod restart rate
    # Detects crash-looping or OOM-killing pods in the new version.
    # -----------------------------------------------------------
    - name: pod-restart-rate
      count: 5
      interval: 2m
      initialDelay: 1m

      # Pass if restart count increase per minute is < 0.1 (less than 1 restart per 10 min)
      successCondition: "result[0] < 0.1"
      failureCondition: "result[0] >= 0.5"
      inconclusiveLimit: 2
      failureLimit: 1

      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090
          query: |
            sum(
              rate(
                kube_pod_container_status_restarts_total{
                  namespace="myapp"
                }[5m]
              )
            ) by (pod)
            * on (pod) group_left()
            (
              kube_pod_labels{
                namespace="myapp",
                label_app_kubernetes_io_name="myapp"
              }
            )

---
# ---------------------------------------------------------------
# ClusterAnalysisTemplate — reusable across namespaces
# (Optional: use if you want to share this template project-wide)
# ---------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: myapp-smoke-test
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: analysis
spec:
  args:
    - name: service-name
    - name: ingress-host
      value: "myapp.example.com"  # TODO: Replace with your domain

  metrics:
    # -----------------------------------------------------------
    # Metric: Smoke test via web-based check
    # Runs a Kubernetes Job that curls the preview endpoint and
    # validates the HTTP response code and body.
    # -----------------------------------------------------------
    - name: smoke-test
      count: 1
      failureLimit: 0

      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke-test
                    image: curlimages/curl:8.7.1
                    command:
                      - sh
                      - -c
                      - |
                        set -e
                        echo "Running smoke test against http://{{args.service-name}}.myapp.svc.cluster.local/healthz/ready"
                        RESPONSE=$(curl -sf -o /dev/null -w "%{http_code}" \
                          --max-time 10 \
                          --retry 3 \
                          --retry-delay 5 \
                          "http://{{args.service-name}}.myapp.svc.cluster.local/healthz/ready")
                        echo "HTTP response: $RESPONSE"
                        if [ "$RESPONSE" != "200" ]; then
                          echo "FAIL: Expected 200, got $RESPONSE"
                          exit 1
                        fi
                        echo "PASS: Smoke test succeeded"
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                      limits:
                        cpu: 50m
                        memory: 32Mi
