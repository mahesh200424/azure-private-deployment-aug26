# Required variable group `platform-config`:
#   ACR_NAME           Terraform output module.acr.acr_name
#   ACR_LOGIN_SERVER   Terraform output acr_login_server
#   APP_NAME           myapp
# The AKS agent pod uses a federated workload identity with AcrPush.

trigger:
  branches:
    include: [main]
  paths:
    exclude: [helm/**, "*.md"]

pr: none

pool:
  name: private-vnet-pool

variables:
  - group: platform-config
  - name: IMAGE_REPOSITORY
    value: "$(ACR_LOGIN_SERVER)/$(APP_NAME)"
  - name: BUILD_TAG
    value: "$(Build.BuildId)"

stages:
  - stage: Build
    displayName: Build and test
    jobs:
      - job: BuildAndTest
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -euo pipefail
              docker run --rm \
                -v "$(Build.SourcesDirectory):/workspace" \
                -w /workspace \
                maven:3.9-eclipse-temurin-17 \
                mvn --no-transfer-progress test
            displayName: Run unit tests

          - task: PublishTestResults@2
            displayName: Publish unit-test results
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "**/surefire-reports/TEST-*.xml"
              failTaskOnFailedTests: true

          - script: |
              set -euo pipefail
              build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              docker build \
                --build-arg BUILD_DATE="$build_date" \
                --build-arg VCS_REF="$(Build.SourceVersion)" \
                --build-arg VERSION="$(BUILD_TAG)" \
                -t "$(IMAGE_REPOSITORY):$(BUILD_TAG)" \
                -t "$(IMAGE_REPOSITORY):latest" \
                -f pipeline/Dockerfile .
            displayName: Build immutable application image

          - script: |
              set -euo pipefail
              name="myapp-smoke-$(Build.BuildId)"
              docker run -d --rm --name "$name" -p 18080:8080 "$(IMAGE_REPOSITORY):$(BUILD_TAG)"
              trap 'docker logs "$name" || true; docker stop "$name" || true' EXIT
              for attempt in $(seq 1 30); do
                curl --fail --silent --max-time 5 http://localhost:18080/actuator/health/readiness | grep -q '"status":"UP"' && exit 0
                sleep 2
              done
              exit 1
            displayName: Smoke-test the image

          - script: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)/docker"
              docker save "$(IMAGE_REPOSITORY):$(BUILD_TAG)" "$(IMAGE_REPOSITORY):latest" | gzip > "$(Build.ArtifactStagingDirectory)/docker/image.tar.gz"
            displayName: Export image

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/docker"
              artifact: docker-image

  - stage: Push
    displayName: Push to private ACR
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: PushImage
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: docker-image
              path: "$(Pipeline.Workspace)/docker-image"

          - script: |
              set -euo pipefail
              gunzip -c "$(Pipeline.Workspace)/docker-image/image.tar.gz" | docker load
              federated_token=""
              while IFS= read -r line || [[ -n "$line" ]]; do
                federated_token+="$line"
              done < "$AZURE_FEDERATED_TOKEN_FILE"
              az login --service-principal \
                --username "$AZURE_CLIENT_ID" \
                --tenant "$AZURE_TENANT_ID" \
                --federated-token "$federated_token" \
                --output none
              az acr login --name "$(ACR_NAME)"
              docker push "$(IMAGE_REPOSITORY):$(BUILD_TAG)"
              docker push "$(IMAGE_REPOSITORY):latest"
              docker logout "$(ACR_LOGIN_SERVER)"
            displayName: Push with the agent workload identity

  - stage: Deploy
    displayName: GitOps deployment
    dependsOn: Push
    condition: succeeded()
    jobs:
      - deployment: UpdateGitOpsRevision
        displayName: Create an ArgoCD deployment revision
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                # Requires "Allow scripts to access the OAuth token" and Contribute
                # permission on the repo for the build service identity.
                - checkout: self
                  persistCredentials: true
                  fetchDepth: 1

                - script: |
                    set -euo pipefail
                    export BUILD_TAG="$(BUILD_TAG)"
                    docker run --rm -e BUILD_TAG \
                      -v "$(Build.SourcesDirectory):/work" -w /work \
                      mikefarah/yq:4.44.3 \
                      -i '.image.tag = strenv(BUILD_TAG)' helm/myapp/values.yaml
                    git config user.name "Azure DevOps GitOps"
                    git config user.email "azure-devops-gitops@local"
                    git add helm/myapp/values.yaml
                    if git diff --cached --quiet; then exit 0; fi
                    git commit -m "chore(deploy): promote image $(BUILD_TAG) [skip ci]"
                    git push origin HEAD:main
                  displayName: Commit the immutable image tag for ArgoCD
