---
# SecretProviderClass provisions Azure Key Vault secrets via the Secrets Store CSI Driver.
# Prerequisites:
#   - secrets-store-csi-driver installed in the cluster
#   - azure-keyvault-provider installed
#   - Workload Identity configured with appropriate Key Vault access policies or RBAC
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "myapp.fullname" . }}-akv
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    # Use Workload Identity (AAD Pod Identity v2 / Azure AD Workload Identity)
    clientID: {{ .Values.serviceAccount.annotations | default dict | index "azure.workload.identity/client-id" | default "" | quote }}
    keyvaultName: {{ .Values.keyVault.vaultName | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    cloudName: ""  # AzurePublicCloud (leave empty); set to AzureUSGovernmentCloud, AzureChinaCloud, etc. as needed
    objects: |
      array:
        {{- range .Values.keyVault.secrets }}
        - |
          objectName: {{ .objectName | quote }}
          objectType: {{ .objectType | quote }}
          {{- if .objectVersion }}
          objectVersion: {{ .objectVersion | quote }}
          {{- end }}
        {{- end }}

  # Sync mounted CSI secrets as native Kubernetes Secrets so they can be
  # injected as env vars by other workloads if needed.
  secretObjects:
    {{- range .Values.keyVault.secrets }}
    - secretName: {{ printf "%s-%s" (include "myapp.fullname" $) .secretName }}
      type: Opaque
      data:
        - objectName: {{ .objectName | quote }}
          key: {{ .secretName | quote }}
    {{- end }}
