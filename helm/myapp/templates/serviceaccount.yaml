{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "myapp.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
    # Required label for Azure AD Workload Identity
    azure.workload.identity/use: "true"
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Document that this SA is bound to an Azure Managed Identity.
    # The actual binding is done via a FederatedIdentityCredential in Azure AD.
    # Command to create it:
    #   az identity federated-credential create \
    #     --name myapp-federated-credential \
    #     --identity-name <MANAGED_IDENTITY_NAME> \
    #     --resource-group <RESOURCE_GROUP> \
    #     --issuer <AKS_OIDC_ISSUER_URL> \
    #     --subject system:serviceaccount:{{ .Release.Namespace }}:{{ include "myapp.serviceAccountName" . }}
automountServiceAccountToken: true
{{- end }}
